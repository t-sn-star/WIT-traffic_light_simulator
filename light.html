<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="utf-8"/>
      <meta name="viewport" content="width=device-width, initial-scale=1"/>
      <title>Traffic Light</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <h1>Traffic Light Simulator</h1>
        <h2>Click the lights to change the traffic signal</h2>
        <button onclick="changeColor()">Play</button>
        <script src="light.js"></script>
        <div>
          <img id="all" src="traffic_all.png" alt="Traffic Light"/>
          <img id="red" src="traffic_red.png" alt="Red Light"/>
          <img id="yellow" src="traffic_yellow.png" alt="Yellow Light"/>
          <img id="green" src="traffic_green.png" alt="Green Light"/>
        </div>
        
    </body>
</html>
